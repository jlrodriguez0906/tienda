name: Release automático

on:
  push:
    branches: [main]

# Solo este workflow necesita escribir: crea el PR de versión, la etiqueta y el changelog.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          release-type: node
