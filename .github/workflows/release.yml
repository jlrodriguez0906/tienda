name: Release automático

on:
  push:
    branches: [main]

# Solo este workflow necesita escribir: crea el PR de versión, la etiqueta y el changelog.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
