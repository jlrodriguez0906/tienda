name: Análisis estático (CodeQL)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

# Permiso base: solo lectura.
permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    # Solo este job necesita escribir: sube los hallazgos a la pestaña Security.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
